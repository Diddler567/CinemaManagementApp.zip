# --- DATASOURCE (H2 IN-MEMORY) ---
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / HIBERNATE ---
# ΔΗΜΙΟΥΡΓΕΊ ΤΟ SCHEMA ΑΠΌ ΤΑ @ENTITY ΣΕ ΚΆΘΕ ΕΚΚΊΝΗΣΗ
# (ΓΙΑ IN-MEMORY DB ΕΊΝΑΙ ΤΟ ΠΙΟ ΚΑΘΑΡΌ: ΞΕΚΙΝΆΣ ΠΆΝΤΑ ΑΠΌ ΚΑΘΑΡΉ ΒΆΣΗ + DATA.SQL)
spring.jpa.hibernate.ddl-auto=create-drop

# ΠΡΟΑΙΡΕΤΙΚΆ: ΔΉΛΩΣΕ DIALECT (ΣΥΝΉΘΩΣ ΤΟ ΒΡΊΣΚΕΙ ΜΌΝΟ ΤΟΥ)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SHOW SQL IN LOGS (USEFUL FOR DEBUGGING)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NAMING STRATEGIES (ΚΡΑΤΆΜΕ ΤΑ ΔΙΚΆ ΣΟΥ)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# --- SQL INIT (RUN DATA.SQL) ---
# ΤΡΈΧΕΙ ΠΆΝΤΑ SCHEMA/DATA SCRIPTS (ΌΧΙ ΜΌΝΟ ΣΕ EMBEDDED)
spring.sql.init.mode=always

# ΠΟΛΎ ΣΗΜΑΝΤΙΚΌ: ΠΡΏΤΑ ΦΤΙΆΧΝΕΙ ΠΊΝΑΚΕΣ Η HIBERNATE, ΜΕΤΆ ΤΡΈΧΕΙ ΤΟ DATA.SQL
spring.jpa.defer-datasource-initialization=true

# (ΠΡΟΑΙΡΕΤΙΚΌ) ΓΙΑ ΝΑ "ΣΚΆΕΙ" ΑΝ ΈΧΕΙ ΛΆΘΟΣ ΚΆΠΟΙΟ INSERT
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8

# --- H2 CONSOLE ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- APP SETTINGS ---
app.auth.token-ttl-seconds=3600
